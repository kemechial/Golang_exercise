version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: orderdb_test
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "55432:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
  test:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.test
    env_file:
      - .env.test
    depends_on:
      - db
    command: ["go", "test", "-v", "./..."]
volumes:
  pgdata_test:
