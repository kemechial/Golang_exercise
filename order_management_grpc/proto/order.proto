
syntax = "proto3";

package order.v1;

option go_package = "order_management_grpc/proto/orderpb;orderpb";

import "google/protobuf/timestamp.proto";

// Order represents a customer order
message Order {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  repeated OrderItem items = 4;
  OrderStatus status = 5;
  double total_amount = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// OrderItem represents an item in an order
message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double total_price = 5;
}

// OrderStatus enum
enum OrderStatus {
  PENDING = 0;
  CONFIRMED = 1;
  PREPARING = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}

// Request messages
message CreateOrderRequest {
  string customer_id = 1;
  string customer_name = 2;
  repeated OrderItem items = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
}

message ListOrdersRequest {
  string customer_id = 1; // Optional: filter by customer
  int32 page_size = 2;
  string page_token = 3;
}

message CancelOrderRequest {
  string order_id = 1;
}

// Response messages
message CreateOrderResponse {
  Order order = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CancelOrderResponse {
  Order order = 1;
}

// OrderService defines the gRPC service
service OrderService {
  // Create a new order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // Get order by ID
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  
  // Update order status
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  
  // List orders with optional filtering
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  
  // Cancel an order
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  
  // Server streaming: Watch order status updates
  rpc WatchOrderStatus(GetOrderRequest) returns (stream Order);
  
  // Client streaming: Batch create orders
  rpc BatchCreateOrders(stream CreateOrderRequest) returns (ListOrdersResponse);
  
  // Bidirectional streaming: Real-time order processing
  rpc ProcessOrdersStream(stream UpdateOrderStatusRequest) returns (stream Order);
}

